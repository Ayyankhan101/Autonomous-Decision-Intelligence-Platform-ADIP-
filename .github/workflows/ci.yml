name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: lint + model-free tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install (frozen lockfile)
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Test (model tier deselected)
        run: uv run pytest -q

  model:
    # laya-mlx = MLX = macOS arm64 only. Runs on main / manual dispatch so a
    # checkpoint pull never blocks a PR; the gate truth itself (exit 1 when
    # gates fail) is still covered model-free by tests/test_gates.py.
    name: strict eval (macos)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: unit
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install (frozen lockfile)
        run: uv sync --frozen
      - name: Cache checkpoint
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-aac6fef-laya-mlx-${{ runner.os }}
      - name: Model tier tests
        run: uv run pytest -q -m model
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: evals/results/eval-*.json
          if-no-files-found: warn
