[project]
name = "adip"
version = "0.1.0"
description = "Autonomous Decision Intelligence Platform — typed, calibrated, auditable decisions served locally on laya-mlx"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "laya-mlx==0.2.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adip", "jevcity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not model'"
markers = [
    "model: needs the laya-mlx checkpoint downloaded (excluded from the PR tier)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv-bench", "__pycache__"]

[tool.ruff.lint]
# E9 = syntax/flake8 fatal; F = pyflakes (unused imports, undefined names)
select = ["E9", "F"]
